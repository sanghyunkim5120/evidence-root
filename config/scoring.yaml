# 근거 품질/판정 가중치 설정. 코드에서 config/scoring.yaml 을 읽어 사용한다.

evidence_weights:
  official_statement: 1.0
  official_statistics: 1.0
  legal_document: 0.95
  corporate_disclosure: 0.85
  academic_or_research: 0.9
  original_reporting: 0.8
  news_report: 0.6
  news_republication: 0.25
  fact_check: 0.9
  social_post: 0.35
  blog: 0.3
  community: 0.2
  image_match: 0.3
  unknown: 0.2

relevance_threshold: 0.35
tfidf_prefilter_threshold: 0.15
fuzzy_dedupe_threshold: 88

independence_decay: 0.6 # 동일 군집 내 2번째 근거부터 적용되는 감쇠(원출처 1개만 완전 반영)

verdict_thresholds:
  confirmed: {min_support: 3, min_score: 0.85, max_conflict: 0.1}
  likely_true: {min_support: 2, min_score: 0.65}
  partially_supported: {min_support: 1, min_score: 0.45}
  mixed: {min_conflict: 0.4}
  likely_false: {min_refute: 2, min_score: 0.65}
  false: {min_refute: 3, min_score: 0.85, max_conflict: 0.1}
  insufficient_evidence: {max_total_evidence: 1}
  unverifiable: {checkability_not: "checkable"}

analysis_modes:
  fast:
    queries_per_claim: 4
    results_per_query: 10
    max_raw_results_per_claim: 40
    max_fetched_documents: 20
    max_final_evidence: 8
  thorough:
    queries_per_claim_min: 6
    queries_per_claim_max: 8
    results_per_query: 20
    max_raw_results_per_claim: 120
    max_fetched_documents: 50
    max_final_evidence: 15
